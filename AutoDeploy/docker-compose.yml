services:
  iter8-deployer:
    container_name: iter8-deployer
    build: .
    read_only: true
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker    # anonymous
      - /app/repo        # anonymous
      - /tmp             # anonymous
      - iter8-bot-data:/app/data:rw # allow read-write into the bot's volume
#    ports:
#      - "8080:8080"
