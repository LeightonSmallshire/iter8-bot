name: autorun-iter8-bot

services:
  iter8-bot-runner:
    build: Python
    read_only: true
    restart: always
    env_file: ../.env
    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock
      - iter8-bot-data:/app/data:rw
      - /home/nonroot/.cache # anonymous

  # Reverse proxy to the bot's webapp. Same service name and port as the old
  # static file server, so an existing Nginx Proxy Manager upstream keeps
  # resolving without any changes over there. Not published to the host.
  bot-web-server:
    build: Web
    restart: always
    read_only: true
    depends_on:
      - iter8-bot-runner
    expose:
      - "80"
    tmpfs:
      - /var/cache/nginx
      - /run

  # iter8-bot-runner:
  #   build: Cpp
  #   read_only: true
  #   restart: always
  #   env_file:
  #     - ../.env # Actually in AutoDeploy... weird inside-out repo
  #   volumes:
  #     - iter8-bot-data:/app/data:rw
  #     - /home/nonroot/.cache # anonymous

volumes:
  iter8-bot-data:
    name: iter8-bot-data
    external: true

networks:
  default:
    name: iter8-network
    external: true
