name: autorun-iter8-bot

services:
  iter8-bot-runner:
    build: Python
    read_only: true
    restart: always
    env_file: ../.env
    ports:
      - "8090:8090"
    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock
      - iter8-bot-data:/app/data:rw
      - /home/nonroot/.cache # anonymous

  # iter8-bot-runner:
  #   build: Cpp
  #   read_only: true
  #   restart: always
  #   env_file:
  #     - ../.env # Actually in AutoDeploy... weird inside-out repo
  #   volumes:
  #     - iter8-bot-data:/app/data:rw
  #     - /home/nonroot/.cache # anonymous

volumes:
  iter8-bot-data:
    name: iter8-bot-data
    external: true

networks:
  default:
    name: iter8-network
    external: true
