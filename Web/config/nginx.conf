worker_processes auto;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;

    # Docker's embedded DNS. Re-resolved per request so a recreated bot
    # container (new IP) is picked up without restarting nginx, and so nginx
    # can start even when the bot container does not exist yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        root /var/www/my_static_app;

        # The legacy static pages keep their original URLs.
        location = /go.html {
            try_files /go.html =404;
        }

        location = /tictactoe.html {
            try_files /tictactoe.html =404;
        }

        location /legacy/ {
            alias /var/www/my_static_app/;
        }

        location / {
            set $upstream http://iter8-bot-runner:8090;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
